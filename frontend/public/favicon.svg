<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 2026-10-02 品牌统一：原 favicon 是模板遗留的紫色闪电，与应用 zinc+teal 体系无关。
       改为 teal-400→teal-600 渐变圆角方 + 深色 A 字标（对应产品名 Artifex），
       与改版后主按钮（teal 底 + 深字）同一视觉语言；A 的横杠用背景色镂空，小尺寸也认得出 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <path fill="#042f2e" d="M24 7.5 42 40.5h-9.4L24 23.2 15.4 40.5H6L24 7.5Z"/>
  <rect x="14.8" y="30.6" width="18.4" height="5.2" rx="1.6" fill="url(#bg)"/>
</svg>
