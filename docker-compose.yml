services:
  # ====== PostgreSQL 15 + pgvector ======
  postgres:
    image: pgvector/pgvector:pg15
    container_name: lingua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: lingua_dev
      POSTGRES_DB: lingua_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua -d lingua_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== Redis 7 ======
  redis:
    image: redis:7-alpine
    container_name: lingua-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ====== MinIO（对象存储） ======
  minio:
    image: minio/minio:latest
    container_name: lingua-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Web Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== 创建 MinIO Bucket（一次性） ======
  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/lingua-learner --ignore-existing;
      mc anonymous set download local/lingua-learner;
      echo 'MinIO bucket ready';
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
